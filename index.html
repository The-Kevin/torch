<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>her</title>
    <style>
        /* Reset e configuração da tela preta */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505; /* Preto profundo */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Container principal da tocha */
        .torch-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            /* Área de detecção de hover maior */
            padding: 50px; 
        }

        /* ======= EFEITO DE LUZ (GLOW) ======= */
        .glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(255, 170, 0, 0.15) 0%, rgba(255, 100, 0, 0.05) 40%, transparent 70%);
            bottom: 30px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: pulse-glow 3s infinite alternate ease-in-out;
            transition: all 1.2s ease-in-out;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* ======= CABO DE MADEIRA (PIXEL ART) ======= */
        .handle-wrapper {
            position: relative;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wood-top {
            width: 36px;
            height: 12px;
            background: #4E342E;
            /* Sombras em bloco para simular pixel art */
            box-shadow: 
                inset -4px 0 0 #3E2723,
                inset 4px 0 0 #795548;
            position: relative;
        }

        .wood-base {
            width: 24px;
            height: 80px;
            background: #5C4033;
            box-shadow: 
                inset -4px 0 0 #3E2723,
                inset 4px 0 0 #8D6E63;
        }

        /* A brasa que fica acesa quando apagada */
        .ember {
            position: absolute;
            top: 0;
            left: 4px;
            width: 28px;
            height: 4px;
            background: #ff3300;
            opacity: 0; /* Invisível enquanto a tocha está acesa */
            transition: opacity 1s ease-in-out;
            box-shadow: 0 0 10px 2px #ff4500;
        }

        /* ======= CHAMAS ======= */
        .flames {
            position: absolute;
            bottom: 150px;
            width: 50px;
            height: 80px;
            z-index: 3;
            transition: opacity 0.5s ease-out, transform 0.8s ease-in-out;
        }

        .flame {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: center bottom;
            animation: burn 1.5s infinite ease-in;
        }

        /* Blocos quadrados rotacionados imitando pixels dinâmicos */
        .flame.red {
            width: 40px; height: 40px;
            background: #E53935;
            margin-left: -20px;
            animation-duration: 1.6s;
            animation-delay: 0.1s;
        }

        .flame.orange {
            width: 30px; height: 30px;
            background: #FB8C00;
            margin-left: -15px;
            animation-duration: 1.4s;
            animation-delay: 0.3s;
        }

        .flame.yellow {
            width: 20px; height: 20px;
            background: #FDD835;
            margin-left: -10px;
            animation-duration: 1.2s;
            animation-delay: 0s;
        }

        @keyframes burn {
            0% { transform: translateY(0) rotate(45deg) scale(1); opacity: 1; }
            50% { opacity: 0.9; }
            100% { transform: translateY(-70px) rotate(45deg) scale(0.1); opacity: 0; }
        }

        /* ======= FAGULHAS (ESPERANÇA) ======= */
        .spark {
            position: absolute;
            width: 4px; height: 4px;
            background: #FFF59D;
            bottom: 20px;
            left: 50%;
            opacity: 0;
        }

        .spark:nth-child(1) { animation: spark-fly 2s infinite linear 0.5s; margin-left: -15px; }
        .spark:nth-child(2) { animation: spark-fly 2.5s infinite linear 1.2s; margin-left: 12px; }
        .spark:nth-child(3) { animation: spark-fly 1.8s infinite linear 1.8s; margin-left: -5px; }
        .spark:nth-child(4) { animation: spark-fly 2.2s infinite linear 0.8s; margin-left: 5px; }

        @keyframes spark-fly {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        /* ======= ESTADO APAGADO (EXTINGUISHED) ======= */
        .torch-container.extinguished .flames {
            opacity: 0;
            transform: scale(0.2) translateY(50px);
        }

        .torch-container.extinguished .glow {
            width: 120px;
            height: 120px;
            bottom: 60px;
            background: radial-gradient(circle, rgba(255, 60, 0, 0.25) 0%, transparent 70%);
            animation: ember-pulse-glow 1.5s infinite alternate ease-in-out;
        }

        .torch-container.extinguished .ember {
            opacity: 1;
            animation: ember-pulse 1.5s infinite alternate ease-in-out;
        }

        @keyframes ember-pulse {
            0% { opacity: 0.7; box-shadow: 0 0 5px 1px #ff4500; }
            100% { opacity: 1; box-shadow: 0 0 12px 3px #ff2a00; }
        }

        @keyframes ember-pulse-glow {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.1); }
        }
        

        .phrase {
            color: white;
        }

    </style>
</head>
<body>

    <div class="torch-container" id="torch">
        <div class="glow"></div>
        
        <div class="flames">
            <div class="flame red"></div>
            <div class="flame orange"></div>
            <div class="flame yellow"></div>
            
            <div class="spark"></div>
            <div class="spark"></div>
            <div class="spark"></div>
            <div class="spark"></div>
        </div>

        <div class="handle-wrapper">
            <div class="wood-top">
                <div class="ember"></div>
            </div>
            <div class="wood-base"></div>
        </div>
    </div>

    <center> <h3 class="phrase">Eu continuo te amando</h3></center>

    <script>
        const torch = document.getElementById('torch');
        let isExtinguished = false;
        let reigniteTimeout;

        function extinguishFlame(event) {
            // Se for evento de toque no mobile, previne o mouseenter para não duplicar a execução
            if (event.type === 'touchstart') {
                event.preventDefault();
            }

            // Se já estiver apagada, não faz nada
            if (isExtinguished) return;

            // Apaga a chama
            isExtinguished = true;
            torch.classList.add('extinguished');

            // Limpa qualquer timer anterior (caso aconteça algum glitch)
            clearTimeout(reigniteTimeout);

            // Aguarda 3 segundos (3000 milissegundos) para reacender
            reigniteTimeout = setTimeout(() => {
                torch.classList.remove('extinguished');
                isExtinguished = false;
            }, 3000);
        }

        // Eventos para Desktop (Mouse) e Mobile (Touch)
        torch.addEventListener('mouseenter', extinguishFlame);
        torch.addEventListener('touchstart', extinguishFlame, { passive: false });
    </script>

</body>
</html>
